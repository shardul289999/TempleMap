<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#09090b" />
  <meta name="description" content="An interactive map of temples and sacred heritage across Chhatrapati Sambhajinagar." />
  <title>Sambhajinagar Temple Map</title>
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    :root{--bg:#09090b;--panel:#111116;--panel2:#17171d;--text:#fff7ec;--muted:#aaa39b;--gold:#f4b74d;--orange:#ff7a2f;--line:rgba(255,255,255,.1);--green:#7de2ae;--shadow:0 24px 70px rgba(0,0,0,.48)}
    *{box-sizing:border-box} html,body{height:100%;margin:0} body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 5% 0%,rgba(244,183,77,.12),transparent 28%),var(--bg);color:var(--text);overflow:hidden}
    button,input{font:inherit}.app{height:100vh;padding:14px;display:grid;grid-template-columns:390px minmax(0,1fr);gap:14px}.panel{background:linear-gradient(180deg,rgba(23,23,29,.96),rgba(12,12,15,.97));border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}.sidebar{display:flex;flex-direction:column;min-height:0}.brand{padding:22px;border-bottom:1px solid var(--line)}.kicker{display:flex;gap:9px;align-items:center;color:var(--gold);text-transform:uppercase;letter-spacing:.17em;font-size:11px;font-weight:900}.kicker:before{content:"";width:28px;height:2px;background:linear-gradient(90deg,var(--gold),var(--orange));border-radius:99px}.brand h1{font-size:37px;line-height:.96;letter-spacing:-.055em;margin:10px 0}.brand p{font-size:13px;line-height:1.55;color:var(--muted);margin:0}.tools{padding:14px 16px 12px;display:grid;gap:10px}.searchRow{display:flex;gap:8px}.search{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--text);padding:12px 13px;border-radius:14px;outline:0}.search:focus{border-color:rgba(244,183,77,.7);box-shadow:0 0 0 4px rgba(244,183,77,.08)}.locate{width:46px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.05);color:#fff;cursor:pointer}.chips{display:flex;gap:7px;overflow:auto;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.035);color:var(--muted);padding:8px 11px;font-size:12px;font-weight:800;cursor:pointer}.chip.active{background:var(--gold);border-color:var(--gold);color:#18130b}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;padding:0 2px}.list{padding:0 12px 14px;overflow:auto;display:grid;gap:9px;scrollbar-width:thin}.card{border:1px solid var(--line);border-radius:17px;padding:13px;background:rgba(255,255,255,.032);cursor:pointer;transition:.18s ease}.card:hover,.card.active{transform:translateY(-1px);border-color:rgba(244,183,77,.5);background:rgba(244,183,77,.07)}.cardHead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.templeName{font-size:14px;font-weight:850;line-height:1.25}.badge{font-size:10px;font-weight:900;color:#15110a;background:var(--gold);border-radius:999px;padding:5px 7px}.card p{font-size:11px;color:var(--muted);line-height:1.45;margin:8px 0 0}.mapPanel{position:relative}.mapPanel:before{content:"";position:absolute;inset:0;pointer-events:none;z-index:500;box-shadow:inset 0 0 100px rgba(0,0,0,.18)}#map{height:100%;width:100%;background:#171717}.mapTitle{position:absolute;top:18px;left:18px;z-index:600;padding:11px 14px;border-radius:15px;border:1px solid var(--line);background:rgba(10,10,13,.78);backdrop-filter:blur(14px);box-shadow:0 12px 30px rgba(0,0,0,.28)}.mapTitle strong{display:block;font-size:13px}.mapTitle span{display:block;font-size:10px;color:var(--muted);margin-top:3px}.credit{position:absolute;right:18px;bottom:18px;z-index:600;color:#c9c2b8;background:rgba(10,10,13,.78);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:10px;backdrop-filter:blur(10px)}.leaflet-control-zoom a{background:#111116!important;color:#fff!important;border-color:#333!important}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#131318;color:#fff}.popup{min-width:215px}.popup .type{font-size:10px;color:var(--gold);font-weight:900;text-transform:uppercase;letter-spacing:.12em}.popup h3{font-size:16px;margin:6px 0 7px}.popup p{color:#bdb6ad;font-size:12px;line-height:1.45;margin:0 0 11px}.popup a{display:inline-block;color:#17120b;background:var(--gold);text-decoration:none;font-weight:900;padding:8px 10px;border-radius:10px;font-size:11px}.pin{width:28px;height:28px;border-radius:50% 50% 50% 8px;transform:rotate(-45deg);background:linear-gradient(135deg,var(--gold),var(--orange));border:2px solid #fff8;box-shadow:0 7px 16px #0008}.pin:after{content:"";position:absolute;inset:8px;border-radius:50%;background:#21180e}.leaflet-div-icon{background:transparent;border:0}.empty{color:var(--muted);font-size:12px;padding:22px;text-align:center}
    @media(max-width:820px){body{overflow:auto}.app{height:auto;min-height:100vh;grid-template-columns:1fr;grid-template-rows:auto 62vh;padding:9px}.sidebar{max-height:56vh}.brand{padding:17px}.brand h1{font-size:31px}.mapPanel{min-height:62vh}.mapTitle{top:12px;left:12px}.credit{display:none}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar panel">
    <section class="brand">
      <div class="kicker">Sacred heritage · Maharashtra</div>
      <h1>Sambhajinagar<br>Temple Map</h1>
      <p>Explore historic shrines, active city temples and the remarkable sacred landscape around Ellora.</p>
    </section>
    <section class="tools">
      <div class="searchRow">
        <input id="search" class="search" placeholder="Search temple or deity…" aria-label="Search temples" />
        <button id="locate" class="locate" title="Show my location" aria-label="Show my location">◎</button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="meta"><span id="count"></span><span>Tap a card to fly there</span></div>
    </section>
    <section class="list" id="list"></section>
  </aside>
  <main class="mapPanel panel">
    <div class="mapTitle"><strong>Chhatrapati Sambhajinagar</strong><span>Temple & sacred heritage explorer</span></div>
    <div id="map"></div>
    <div class="credit">Curated starter map · OpenStreetMap base</div>
  </main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const temples=[
 {id:'grishneshwar',name:'Shri Ghrishneshwar Jyotirlinga',deity:'Shiva',type:'Pilgrimage',lat:20.02482,lng:75.16993,area:'Verul · Ellora',note:'The 12th Jyotirlinga; the present red-stone temple was substantially rebuilt in the 18th century.'},
 {id:'kailasa',name:'Kailasa Temple · Ellora Cave 16',deity:'Shiva',type:'Heritage',lat:20.02389,lng:75.17917,area:'Ellora Caves',note:'A monumental 8th-century rock-cut temple and the celebrated centrepiece of the Ellora complex.'},
 {id:'bhadra',name:'Shri Bhadra Maruti Mandir',deity:'Hanuman',type:'Pilgrimage',lat:20.00981,lng:75.19567,area:'Khuldabad',note:'A much-loved Hanuman shrine known for its reclining image, close to the Ellora pilgrimage circuit.'},
 {id:'khandoba',name:'Shri Khandoba Temple',deity:'Khandoba / Shiva',type:'Heritage',lat:19.84082,lng:75.32461,area:'Satara · Sambhajinagar',note:'A historic stone temple and local pilgrimage landmark south of the city centre.'},
 {id:'varad',name:'Shri Varad Ganesh Mandir',deity:'Ganesha',type:'City Temple',lat:19.87844,lng:75.32230,area:'Samarth Nagar',note:'A popular central-city Ganesh temple serving devotees throughout the year.'},
 {id:'gajanan',name:'Shri Gajanan Maharaj Mandir',deity:'Gajanan Maharaj',type:'City Temple',lat:19.86881,lng:75.35092,area:'Garkheda',note:'A busy devotional centre in Garkheda with an associated prasadalay.'}
];
const cats=['All','Heritage','Pilgrimage','City Temple']; let active='All'; let query='';
const map=L.map('map',{zoomControl:true}).setView([19.94,75.27],10.5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const icon=L.divIcon({className:'',html:'<div class="pin"></div>',iconSize:[28,28],iconAnchor:[14,28],popupAnchor:[0,-27]});
const markers=new Map();
temples.forEach(t=>{const m=L.marker([t.lat,t.lng],{icon}).addTo(map).bindPopup(`<div class="popup"><div class="type">${t.type} · ${t.area}</div><h3>${t.name}</h3><p>${t.note}</p><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${t.lat},${t.lng}">Directions ↗</a></div>`);markers.set(t.id,m)});
const chips=document.getElementById('chips'); cats.forEach(c=>{const b=document.createElement('button');b.className='chip'+(c==='All'?' active':'');b.textContent=c;b.onclick=()=>{active=c;[...chips.children].forEach(x=>x.classList.toggle('active',x.textContent===c));render()};chips.appendChild(b)});
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.toLowerCase().trim();render()});
function filtered(){return temples.filter(t=>(active==='All'||t.type===active)&&(`${t.name} ${t.deity} ${t.area}`.toLowerCase().includes(query)))}
function render(){const data=filtered(),list=document.getElementById('list');document.getElementById('count').textContent=`${data.length} place${data.length===1?'':'s'}`;list.innerHTML='';temples.forEach(t=>{const m=markers.get(t.id); if(data.includes(t)){if(!map.hasLayer(m))m.addTo(map)}else if(map.hasLayer(m))map.removeLayer(m)});if(!data.length){list.innerHTML='<div class="empty">No temples match that search.</div>';return}data.forEach(t=>{const el=document.createElement('article');el.className='card';el.innerHTML=`<div class="cardHead"><div class="templeName">${t.name}</div><span class="badge">${t.deity}</span></div><p><b>${t.area}</b> · ${t.note}</p>`;el.onclick=()=>{document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));el.classList.add('active');map.flyTo([t.lat,t.lng],15,{duration:1});markers.get(t.id).openPopup()};list.appendChild(el)})}
render();
document.getElementById('locate').onclick=()=>{if(!navigator.geolocation){alert('Location is not available in this browser.');return}navigator.geolocation.getCurrentPosition(p=>{const ll=[p.coords.latitude,p.coords.longitude];L.circleMarker(ll,{radius:8,color:'#fff',weight:3,fillColor:'#7de2ae',fillOpacity:1}).addTo(map).bindPopup('You are here').openPopup();map.flyTo(ll,13)},()=>alert('Location permission was not granted.'))};
</script>
</body>
</html>
